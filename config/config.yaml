    Qwen3.8-Flash-Next:   {hf_id: "Qwen/Qwen3.8-Flash-Next", served_name: "nvidia/Qwen3.8-Flash-Next-NVFP4", reasoning: false, enable_thinking: false}
    Lingshu-I-8B:         {hf_id: "lingshu-medical-mllm/Lingshu-I-8B", served_name: "lingshu-medical-mllm/Lingshu-I-8B", reasoning: false}
    LLaVA-Med-7B:         {hf_id: "chaoyinshe/llava-med-v1.5-mistral-7b-hf", served_name: "/PATH/llava-med-v1.5-7b-hf", reasoning: false, date_from: "microsoft/llava-med-v1.5-mistral-7b"}
    Mistral-Small-3.2-24B: {hf_id: "mistralai/Mistral-Small-3.2-24B-Instruct-2506", served_name: "mistralai/Mistral-Small-3.2-24B-Instruct-2506", reasoning: false}
    Gemma-4-E4B:          {hf_id: "google/gemma-4-E4B-it", served_name: "google/gemma-4-E4B-it", reasoning: false}
    Qwen3.6-35B-A3B:      {hf_id: "Qwen/Qwen3.6-35B-A3B", served_name: "Qwen/Qwen3.6-35B-A3B", reasoning: false, enable_thinking: false}
    Nemotron-3-Nano-Omni-30B-A3B: {hf_id: "nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16", served_name: "nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16", reasoning: false, enable_thinking: false}
    Mistral-Small-4-119B-A6B: {hf_id: "mistralai/Mistral-Small-4-119B-2603", served_name: "mistralai/Mistral-Small-4-119B-2603-NVFP4", reasoning: false, reasoning_effort: "none"}
    Qwen3.5-122B-A10B:    {hf_id: "Qwen/Qwen3.5-122B-A10B", served_name: "Qwen/Qwen3.5-122B-A10B-FP8", reasoning: false, enable_thinking: false}

  stats:
    n_boot:    1000
    boot_seed: 0

  datasets:
    vindr_cxr:
      labels_csv:      "${datasets_root}/XRay/vindr-cxr1/vindr_cxr_master_list.csv"
      boxes_csv:       "${datasets_root}/XRay/vindr-cxr1/vindr_annotations.csv"
      dicom_meta_csvs: ["${datasets_root}/XRay/vindr-cxr1/metadata/test_dicom_metadata.csv", "${datasets_root}/XRay/vindr-cxr1/metadata/train_dicom_metadata.csv"]
      image_dir:       "${datasets_root}/XRay/vindr-cxr1/preprocessed"
      image_size:      [512, 512]
      eval_splits:     ["test"]
      partitions:      ["eval", "dev"]
    vindr_mammo:
      findings_csv:         "${datasets_root}/Mammo/VinDr-Mammo/finding_annotations.csv"
      breast_csv:           "${datasets_root}/Mammo/VinDr-Mammo/breast-level_annotations.csv"
      image_dir:            "${datasets_root}/Mammo/VinDr-Mammo/images"
      image_size:           [912, 1520]
      eval_splits:          ["test"]
      partitions:           ["eval", "dev"]
      no_finding_label:     "No Finding"
      negative_birads:      ["BI-RADS 1"]
      other_finding_birads: ["BI-RADS 3", "BI-RADS 4", "BI-RADS 5"]
    ddr:
      grading_dir:       "${datasets_root}/Fundus/DDR/DR_grading"
      lesion_dir:        "${datasets_root}/Fundus/DDR/lesion_segmentation"
      image_dir:         "${datasets_root}/Fundus/preprocessed512/ddr"
      image_size:        [512, 512]
      splits:            ["train", "valid", "test"]
      lesion_label_dirs: [["train", "label"], ["valid", "segmentation label"], ["test", "label"]]
      lesion_types:      ["EX", "HE", "MA", "SE"]
      eval_splits:       ["valid", "test"]
      partitions:        ["eval", "dev"]
    isic2019:
      groundtruth_csv:    "${datasets_root}/Derm/ISIC2019/ISIC_2019_Training_GroundTruth.csv"
      metadata_csv:       "${datasets_root}/Derm/ISIC2019/ISIC_2019_Training_Metadata.csv"
      image_dir:          "${datasets_root}/Derm/preprocessed512/isic2019"
      lesion_mask_dir:    "${datasets_root}/Derm/ISIC2018_Task1/ISIC2018_Task1_Training_GroundTruth"
      attribute_mask_dir: "${datasets_root}/Derm/ISIC2018_Task2/ISIC2018_Task2_Training_GroundTruth_v3"
      image_size:         [512, 512]
      image_extensions:   [".jpg", ".png"]
      downsampled_suffix: "_downsampled"
      release_split:      "training"
      partitions:         ["eval", "dev"]
      attributes:         ["pigment_network", "globules", "milia_like_cyst", "negative_network", "streaks"]
    pcam:
      x_h5:          "${datasets_root}/Histo/PCam/camelyonpatch_level_2_split_test_x.h5"
      y_h5:          "${datasets_root}/Histo/PCam/camelyonpatch_level_2_split_test_y.h5"
      meta_csv:      "${datasets_root}/Histo/PCam/camelyonpatch_level_2_split_test_meta.csv"
      image_size:    [96, 96]
      release_split: "test"
      partitions:    ["eval"]
    nct_crc:
      eval_dir:         "${datasets_root}/Histo/NCT-CRC-HE-100K/CRC-VAL-HE-7K"
      dev_dir:          "${datasets_root}/Histo/NCT-CRC-HE-100K/NCT-CRC-HE-100K"
      image_size:       [224, 224]
      image_extensions: [".tif"]
      background_class: "BACK"
      partitions:       ["eval", "dev"]
    bhsd:
      dir:                 "${datasets_root}/CT/BHSD"
      index_csv:           "${datasets_root}/CT/BHSD/preprocess_index.csv"
      label_values:        [["epidural", 1], ["intraparenchymal", 2], ["intraventricular", 3], ["subarachnoid", 4], ["subdural", 5]]
      max_positive_slices: 3
      min_slice_distance:  2
      partitions:          ["eval", "dev"]
    lidc:
      dir:                "${datasets_root}/CT/LIDC-IDRI"
      index_csv:          "${datasets_root}/CT/LIDC-IDRI/preprocess_index.csv"
      lung_slice_min_mm2: 1000
      table_area_ratio:   0.5
      partitions:         ["eval", "dev"]
    brats2021:
      dir:                    "${datasets_root}/MRI/BraTS2021"
      index_csv:              "${datasets_root}/MRI/BraTS2021/preprocess_index.csv"
      file_regex:             "^(?P<subject>BraTS2021_[0-9]+)_(?P<sequence>flair|t1ce|seg)\\.nii\\.gz$"
      tumor_labels:           [1, 2, 4]
      enhancing_label:        4
      tumor_min_fraction:     0.01
      enhancing_min_fraction: 0.002
      partitions:             ["eval", "dev"]
    picai:
      dir:               "${datasets_root}/MRI/PI-CAI/picai_public"
      index_csv:         "${datasets_root}/MRI/PI-CAI/picai_public/preprocess_index.csv"
      marksheet:         "${datasets_root}/MRI/PI-CAI/picai_labels/clinical_information/marksheet.csv"
      lesion_dirs:       ["${datasets_root}/MRI/PI-CAI/picai_labels/csPCa_lesion_delineations/human_expert/resampled", "${datasets_root}/MRI/PI-CAI/picai_labels/csPCa_lesion_delineations/human_expert/Pooch25"]
      gland_dir:         "${datasets_root}/MRI/PI-CAI/picai_labels/anatomical_delineations/whole_gland/AI/Bosma22b"
      file_regex:        "^(?P<patient>[0-9]+)_(?P<study>[0-9]+)_t2w\\.nii\\.gz$"
      patient_column:    "patient_id"
      study_column:      "study_id"
      label_column:      "case_csPCa"
      center_column:     "center"
      positive_value:    "YES"
      negative_value:    "NO"
      main_center:       "RUMC"
      crop_factor:       2.0
      partitions:        ["eval", "dev"]
    busbra:
      dir:              "${datasets_root}/Ultrasound/BUS-BRA"
      index_csv:        "${datasets_root}/Ultrasound/BUS-BRA/preprocess_index.csv"
      metadata_csv:     "${datasets_root}/Ultrasound/BUS-BRA/bus_data.csv"
      id_column:        "ID"
      pathology_column: "Pathology"
      malignant_value:  "malignant"
      patient_regex:    "^bus_([0-9]+)-"
      image_size:       [512, 512]
      partitions:       ["eval", "dev"]
    busi:
      dir:              "${datasets_root}/Ultrasound/BUSI"
      index_csv:        "${datasets_root}/Ultrasound/BUSI/preprocess_index.csv"
      classes:          ["benign", "malignant", "normal"]
      normal_class:     "normal"
      image_size:       [512, 512]
