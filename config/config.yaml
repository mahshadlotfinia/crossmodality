    breast:
      dir:              "${datasets_root}/Ultrasound/BrEaST"
      index_csv:        "${datasets_root}/Ultrasound/BrEaST/preprocess_index.csv"
      clinical_xlsx:    "${datasets_root}/Ultrasound/BrEaST/BrEaST-Lesions-USG-clinical-data-Dec-15-2023.xlsx"
