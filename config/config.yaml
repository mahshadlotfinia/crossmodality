ocean_root:    /PATH
home_root:     /PATH
user_home:     /PATH
datasets_root: /PATH/datasets
repo_root:     "${home_root}/Repositories/crossmodality"

outputs_root:  "${ocean_root}/outputs/crossmodality"

Crossmodality:
  llm_api_key:          "YOUR_LLM_API_KEY_HERE"
  llm_api_key_env:      "CROSSMODALITY_LLM_API_KEY"
  llm_api_base_url:     "YOUR_SERVER_URL_HERE"
  llm_api_base_url_env: "CROSSMODALITY_LLM_API_BASE_URL"
  hf_token:             "YOUR_HF_TOKEN_HERE"
  hf_token_env:         "HF_TOKEN"

  serving:
    verify_ssl:            true
    concurrency:           16
    long_call_concurrency: 4
    min_image_tokens:      64
    timeout_s:             120
    timeout_per_token_s:   0.12
    timeout_request_max_s: 2400
    max_retries:           5
    retry_backoff_s:       2.0
    retry_backoff_max_s:   30
    connect_retry_max_s:   600
    rate_limit_retries:    8
    logprobs_top_k:        20
    max_consecutive_failures: 30

  generation:
    temperature:               0.0
    max_new_tokens:            10
    regenerate_max_new_tokens: 64
    option_regenerate_max_new_tokens: 1024
    reasoning_max_new_tokens:  1024
  prompts:
    stems: [["presence", "Is there {display} in this {noun}?"], ["tissue", "Does this {noun} mainly show {display}?"]]
    answer_instruction: "Answer with a single word: Yes or No."
    specialist_question: "You are {specialist}. {stem}"
    specialist_instruction: "Answer Yes or No."
    specialists: [["cxr", "a radiologist"], ["mammo", "a radiologist"], ["fundus", "an ophthalmologist"], ["derm", "a dermatologist"], ["histo", "a pathologist"], ["ct", "a radiologist"], ["mri", "a radiologist"], ["us", "a radiologist"]]
    reasoning_template: "{question}\nYour task:\n1. Think through the question step by step, enclose your reasoning process in <think>...</think> tags.\n2. Then provide the correct answer, Yes or No, inside <answer>...</answer> tags.\n3. No extra information or text outside of these tags."
    options_instruction: "Answer with the letter of the correct option."
    option_line: "{letter}. {text}"
    reasoning_template_options: "{question}\nYour task:\n1. Think through the question step by step, enclose your reasoning process in <think>...</think> tags.\n2. Then provide the correct single-letter choice (A, B, C, D,...) inside <answer>...</answer> tags.\n3. No extra information or text outside of these tags."
  parser:
    affirmative_tokens: ["yes", "yeah", "correct", "true", "present", "positive"]
    negative_tokens:    ["no", "not", "absent", "negative", "false", "incorrect"]
    abstention_phrases: ["need to see", "cannot see", "can't see", "unable to see", "cannot determine", "can't determine", "cannot assess", "unable to assess", "cannot evaluate", "unable to evaluate", "no image", "without the image", "without an image", "image is not", "not provided", "not able to", "i cannot", "i can't", "i am unable", "i'm unable", "insufficient information", "not possible to determine", "please provide"]
    head_chars:         60
    yes_tokens:         ["Yes", "yes", "YES", " Yes", " yes", " YES"]
    no_tokens:          ["No", "no", "NO", " No", " no", " NO"]
    answer_tag_open:    "<answer>"
    answer_tag_close:   "</answer>"
    think_tag_close:    "</think>"
  option_parser:
    letters:    ["A", "B", "C", "D", "E", "F", "G", "H"]
    head_chars: 60

  models:
    Qwen3-VL-2B:          {hf_id: "Qwen/Qwen3-VL-2B-Instruct", served_name: "Qwen/Qwen3-VL-2B-Instruct", reasoning: false}
    Qwen3-VL-4B:          {hf_id: "Qwen/Qwen3-VL-4B-Instruct", served_name: "Qwen/Qwen3-VL-4B-Instruct", reasoning: false}
    Qwen3-VL-8B:          {hf_id: "Qwen/Qwen3-VL-8B-Instruct", served_name: "Qwen/Qwen3-VL-8B-Instruct", reasoning: false}
    Qwen3-VL-32B:         {hf_id: "Qwen/Qwen3-VL-32B-Instruct", served_name: "Qwen/Qwen3-VL-32B-Instruct", reasoning: false}
    InternVL3.5-1B:       {hf_id: "OpenGVLab/InternVL3_5-1B", served_name: "OpenGVLab/InternVL3_5-1B", reasoning: false}
    InternVL3.5-2B:       {hf_id: "OpenGVLab/InternVL3_5-2B", served_name: "OpenGVLab/InternVL3_5-2B", reasoning: false}
    InternVL3.5-4B:       {hf_id: "OpenGVLab/InternVL3_5-4B", served_name: "OpenGVLab/InternVL3_5-4B", reasoning: false}
    InternVL3.5-8B:       {hf_id: "OpenGVLab/InternVL3_5-8B", served_name: "OpenGVLab/InternVL3_5-8B", reasoning: false}
    InternVL3.5-14B:      {hf_id: "OpenGVLab/InternVL3_5-14B", served_name: "OpenGVLab/InternVL3_5-14B", reasoning: false}
    Gemma-3-4B:           {hf_id: "google/gemma-3-4b-it", served_name: "google/gemma-3-4b-it", reasoning: false}
    Gemma-3-12B:          {hf_id: "google/gemma-3-12b-it", served_name: "google/gemma-3-12b-it", reasoning: false}
    Gemma-3-27B:          {hf_id: "google/gemma-3-27b-it", served_name: "google/gemma-3-27b-it", reasoning: false}
    Qwen3.5-4B:           {hf_id: "Qwen/Qwen3.5-4B", served_name: "Qwen/Qwen3.5-4B", reasoning: false, enable_thinking: false}
    Qwen3.5-9B:           {hf_id: "Qwen/Qwen3.5-9B", served_name: "Qwen/Qwen3.5-9B", reasoning: false, enable_thinking: false}
    Qwen3.5-27B:          {hf_id: "Qwen/Qwen3.5-27B", served_name: "Qwen/Qwen3.5-27B", reasoning: false, enable_thinking: false}
    Ministral-3-3B:       {hf_id: "mistralai/Ministral-3-3B-Instruct-2512-BF16", served_name: "mistralai/Ministral-3-3B-Instruct-2512-BF16", reasoning: false}
    Ministral-3-8B:       {hf_id: "mistralai/Ministral-3-8B-Instruct-2512-BF16", served_name: "mistralai/Ministral-3-8B-Instruct-2512-BF16", reasoning: false}
    Ministral-3-14B:      {hf_id: "mistralai/Ministral-3-14B-Instruct-2512-BF16", served_name: "mistralai/Ministral-3-14B-Instruct-2512-BF16", reasoning: false}
    InternVL3-8B:         {hf_id: "OpenGVLab/InternVL3-8B", served_name: "OpenGVLab/InternVL3-8B", reasoning: false}
    InternVL3-2B:         {hf_id: "OpenGVLab/InternVL3-2B", served_name: "OpenGVLab/InternVL3-2B", reasoning: false}
    InternVL3-14B:        {hf_id: "OpenGVLab/InternVL3-14B", served_name: "OpenGVLab/InternVL3-14B", reasoning: false}
    InternVL3-1B:         {hf_id: "OpenGVLab/InternVL3-1B", served_name: "OpenGVLab/InternVL3-1B", reasoning: false}
    Qwen2.5-VL-7B:        {hf_id: "Qwen/Qwen2.5-VL-7B-Instruct", served_name: "Qwen/Qwen2.5-VL-7B-Instruct", reasoning: false}
    Qwen3.6-27B:          {hf_id: "Qwen/Qwen3.6-27B", served_name: "Qwen/Qwen3.6-27B", reasoning: false, enable_thinking: false}
    Gemma-4-31B:          {hf_id: "google/gemma-4-31B-it", served_name: "google/gemma-4-31B-it", reasoning: false}
